<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project List</title>
  <link rel="stylesheet" href="main.css">
  <script src="projects.js"></script>
</head>

<body>
  <input type="text" id="searchBar" placeholder="Search projects..." />
  <div id="projects"></div>
  <div id="projectCount"></div>

            if (window.location.protocol !== 'https:') {

            }

  <script>
    const projectContainer = document.getElementById('projects');
    const searchBar = document.getElementById('searchBar');
    let selectedIndex = -1;

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(textarea);
      return ok;
    }

    function getOpenUrl(project) {
      if (project.interfaceLinks?.length) return project.interfaceLinks[0].url;
      if (project.sourceLinks?.length) return project.sourceLinks[0].url;
      return null;
    }

    function getProjectElements() {
      return [...projectContainer.querySelectorAll('.project')];
    }

    function setSelectedIndex(index) {
      const projects = getProjectElements();
      if (!projects.length) {
        selectedIndex = -1;
        return;
      }

      selectedIndex = Math.max(0, Math.min(index, projects.length - 1));
      projects.forEach((el, i) => {
        el.classList.toggle('selected', i === selectedIndex);
      });
      projects[selectedIndex].scrollIntoView({ block: 'nearest' });
    }

    function openSelectedProject() {
      const projects = getProjectElements();
      const selected = projects[selectedIndex];
      if (!selected) return;
      const url = selected.dataset.openUrl;
      if (url) window.open(url, '_blank');
    }

    function renderProjects(filterText = '') {
      projectContainer.innerHTML = '';

      const lower = filterText.toLowerCase();

      const filtered = projectList
        .filter(project => {
          if (!lower) return true; // show all if no filter
          return project.name.toLowerCase().includes(lower) || project.description.toLowerCase().includes(lower);
        })
        // Sort: name matches first, then description-only matches
        .sort((a, b) => {
          const aNameMatch = a.name.toLowerCase().includes(lower);
          const bNameMatch = b.name.toLowerCase().includes(lower);
          if (aNameMatch === bNameMatch) return 0;
          return aNameMatch ? -1 : 1; // a before b if aNameMatch
        });

      filtered.forEach(project => {
          const projectElement = document.createElement('div');
          projectElement.className = 'project';
          const openUrl = getOpenUrl(project);
          if (openUrl) projectElement.dataset.openUrl = openUrl;

          // If the project has tags, create and append the tag elements
          if (project.tags && project.tags.length > 0) {
            project.tags.forEach(tag => {
              const tagElement = document.createElement('span');
              tagElement.className = 'tag';
              tagElement.textContent = tag;

              // Set the background color based on the tags object
              const tagColor = tags[tag];
              if (tagColor) {
                tagElement.style.setProperty('--tag-bg-color', tagColor);
              }

              projectElement.appendChild(tagElement);
            });
          }

          const projectName = document.createElement('div');
          projectName.className = 'project-name';
          projectName.textContent = project.name;

          const description = document.createElement('div');
          description.className = 'description';
          description.textContent = project.description;

          // Helper: Render source links
          const _sourceLinks = () => {
            if (!project.sourceLinks || project.sourceLinks.length === 0) return;

            const sourceList = document.createElement('ul');
            sourceList.className = 'links';

            // Create and append header
            const sourceHeader = document.createElement('strong');
            sourceHeader.textContent = "Source Links:";
            sourceList.appendChild(sourceHeader);

            project.sourceLinks.forEach(link => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = link.url;
              a.textContent = link.displayText;
              a.target = "_blank";
              li.appendChild(a);
              sourceList.appendChild(li);
            });

            projectElement.appendChild(sourceList);
          };

          // Helper: Render interface links
          const _interfaceLinks = () => {
            if (!project.interfaceLinks || project.interfaceLinks.length === 0) return;

            const interfaceList = document.createElement('ul');
            interfaceList.className = 'links';

            // Create and append header
            const interfaceHeader = document.createElement('strong');
            interfaceHeader.textContent = "Interface Links:";
            interfaceList.appendChild(interfaceHeader);

            project.interfaceLinks.forEach(link => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = link.url;
              a.textContent = link.displayText;
              a.target = "_blank";
              li.appendChild(a);
              interfaceList.appendChild(li);
            });

            projectElement.appendChild(interfaceList);
          };

          // Helper: Render buttons (if present)
          const _renderCopyButton = () => {
            if (!project.buttons || project.buttons.length === 0) return; // Only proceed if the project has buttons

            project.buttons.forEach(btn => {
              const copyBtn = document.createElement('button');
              copyBtn.textContent = btn.text;
              copyBtn.addEventListener('click', async () => {
                const label = btn.text;
                const ok = await copyToClipboard(btn.copyText);
                copyBtn.textContent = ok ? 'Copied!' : 'Copy failed';
                setTimeout(() => { copyBtn.textContent = label; }, 1500);
              });

              projectElement.appendChild(copyBtn);
            });
          };

          // Append the core elements
          projectElement.appendChild(projectName);
          projectElement.appendChild(description);

          // Append the dynamic elements
          _sourceLinks();
          _interfaceLinks();
          _renderCopyButton();

          projectContainer.appendChild(projectElement);
        });

      updateProjectCount(filtered.length, projectList.length);
      setSelectedIndex(filtered.length ? 0 : -1);
    }

    const projectCountEl = document.getElementById('projectCount');

    function updateProjectCount(shown, total) {
      if (shown === total) {
        projectCountEl.textContent = total + ' projects';
      } else {
        projectCountEl.textContent = shown + ' of ' + total + ' projects';
      }
    }

    // initial render
    renderProjects();

    // re-render on search input
    searchBar.addEventListener('input', (e) => {
      renderProjects(e.target.value);
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      const tag = e.target.tagName;
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable;
      const inSearch = e.target === searchBar;

      // "/" hotkey focuses the search bar
      if (e.key === '/') {
        if (typing) return;
        e.preventDefault();
        searchBar.focus();
        searchBar.select();
        return;
      }

      // Arrow navigation + Enter open (works from search bar too)
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (typing && !inSearch) return;
        e.preventDefault();
        const delta = e.key === 'ArrowDown' ? 1 : -1;
        setSelectedIndex(selectedIndex + delta);
        return;
      }

      if (e.key === 'Enter') {
        if (typing && !inSearch) return;
        if (tag === 'A' || tag === 'BUTTON') return;
        e.preventDefault();
        openSelectedProject();
      }
    });
  </script>


</body>

</html>
